<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Armonía, Tensiones y Modos Griegos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tonica-bg': '#10B981',
                        'tonica-light': '#D1FAE5',
                        'sub-bg': '#F59E0B',
                        'sub-light': '#FEF3C7',
                        'dom-bg': '#EF4444',
                        'dom-light': '#FEE2E2',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-card {
            ring: 4px solid #3B82F6;
            transform: translateY(-4px);
        }
        .recording-pulse {
            animation: pulse-red 1.2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        #vortex-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: radial-gradient(circle at center, #0a1128 0%, #030712 100%);
            border-bottom: 1px solid #1e293b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas#vortexCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        .vortex-ui-overlay {
            position: absolute;
            z-index: 20;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }
        .vortex-panel {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            backdrop-filter: blur(4px);
            color: #00f0ff;
            font-family: monospace;
            font-size: 0.75rem;
            pointer-events: auto;
        }
        .text-emerald-neon { color: #10b981; }
        .border-emerald-neon { border-color: rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
